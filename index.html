
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fc">
<title>ICU Monitor Pro</title>

<style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --line: #eadfe1;
  --red: #c62828;
  --red-dark: #a51f27;
  --red-light: #fee8e8;
  --green: #16834a;
  --yellow: #a66b00;
  --text: #242833;
  --muted: #727987;
  --shadow: 0 5px 22px rgba(60, 30, 35, 0.06);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button, input {
  font: inherit;
}

button {
  transition: background .2s, transform .2s, box-shadow .2s;
}

/* LOGIN */

#loginScreen {
  display: flex;
  min-height: 100vh;
  justify-content: center;
  align-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at top right, #ffe8e8 0, transparent 35%),
    linear-gradient(145deg, #fffafa, #f5f6fa);
}

.loginBox {
  width: 100%;
  max-width: 390px;
  padding: 38px 32px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--panel);
  box-shadow: 0 18px 55px rgba(100, 30, 40, .10);
  text-align: center;
}

.loginIcon {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  border-radius: 20px;
  background: var(--red-light);
  color: var(--red);
  font-size: 32px;
}

.loginBox h2 {
  color: var(--red);
  font-size: 27px;
  margin-bottom: 8px;
}

.loginSubtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 26px;
}

.loginBox input {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  margin: 0 0 14px;
  border: 1px solid #dfe2e8;
  border-radius: 10px;
  outline: none;
  background: #fff;
  color: var(--text);
}

.loginBox input:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(198, 40, 40, .09);
}

.passwordWrap {
  position: relative;
}

.passwordWrap input {
  padding-right: 45px;
}

.passwordToggle {
  position: absolute;
  right: 12px;
  top: 13px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
}

.loginButton {
  width: 100%;
  min-height: 48px;
  margin-top: 4px;
  border: none;
  border-radius: 10px;
  background: var(--red);
  color: #fff;
  cursor: pointer;
  font-weight: 700;
}

.loginButton:hover {
  background: var(--red-dark);
}

.loginButton:disabled {
  opacity: .7;
  cursor: wait;
}

#error {
  margin-top: 14px;
  font-size: 13px;
  color: var(--red);
}

/* APPLICATION HEADER */

.wrapper {
  min-height: 100vh;
  padding: 24px;
  max-width: 1800px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  padding: 20px 24px;
  border-radius: 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}

.title {
  font-size: 25px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.live {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--green);
  font-size: 14px;
  font-weight: 600;
}

.dot {
  width: 9px;
  height: 9px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #20a464;
  box-shadow: 0 0 0 4px #e6f7ed;
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  50% { box-shadow: 0 0 0 7px rgba(32, 164, 100, .08); }
}

/* GENERAL CARDS */

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

/* ROOM SELECTION */

.homeGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.homeCard {
  position: relative;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 22px;
  cursor: pointer;
  outline: none;
  transition: .22s ease;
}

.homeCard::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--red);
  opacity: .65;
}

.homeCard:hover,
.homeCard:focus-visible {
  transform: translateY(-3px);
  border-color: #e7aaaa;
  background: #fff8f8;
  box-shadow: 0 9px 25px rgba(130, 30, 40, .09);
}

.homeCard h3 {
  font-size: 19px;
  margin-bottom: 9px;
}

.homeCard p {
  color: var(--muted);
  font-size: 14px;
}

/* PATIENT INFORMATION */

.patientGrid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
  gap: 20px;
  align-items: start;
}

.patient-name {
  font-size: 29px;
  font-weight: 750;
  letter-spacing: -.5px;
  margin-bottom: 6px;
  overflow-wrap: anywhere;
}

.sub {
  color: var(--muted);
  font-size: 15px;
}

/* HEART RATE */

.heartCard {
  margin-top: 22px;
  padding: 24px;
  border-radius: 16px;
  background: #fffafa;
  border: 1px solid #f0dada;
}

.heartHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

.heartLabel {
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}

.liveTag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--red);
  font-size: 12px;
  font-weight: 700;
  background: var(--red-light);
  padding: 6px 10px;
  border-radius: 20px;
}

.bigHr {
  font-size: clamp(44px, 6vw, 68px);
  line-height: 1.2;
  color: var(--red);
  font-weight: 800;
  letter-spacing: -2px;
  overflow-wrap: anywhere;
}

.bigHr span {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--muted);
}

/* VITALS GRID */

.sectionTitle {
  font-size: 18px;
  font-weight: 700;
  margin-top: 26px;
  margin-bottom: 14px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.metric {
  min-width: 0;
  background: #fff;
  border: 1px solid var(--line);
  padding: 19px;
  border-radius: 14px;
  transition: border-color .2s, box-shadow .2s;
}

.metric:hover {
  border-color: #e7b6b6;
  box-shadow: 0 4px 15px rgba(130, 30, 40, .05);
}

.metricTop {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
}

.metricIcon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 11px;
  background: var(--red-light);
  color: var(--red);
  font-size: 19px;
  font-weight: 700;
}

.metric .label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.metric .val {
  font-size: clamp(21px, 3vw, 28px);
  font-weight: 750;
  color: var(--text);
  overflow-wrap: anywhere;
  line-height: 1.3;
}

.metric .unit {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}

.metric .hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}

/* ECG AND MOTION STATES */

.stateValue {
  font-size: clamp(17px, 2.2vw, 23px) !important;
  letter-spacing: -.3px;
}

.statePill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
  padding: 6px 10px;
  border-radius: 20px;
  background: #f1f3f6;
  color: #626b78;
  font-size: 12px;
  font-weight: 700;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.statePill::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

.statePill.good {
  background: #e8f7ee;
  color: var(--green);
}

.statePill.warn {
  background: #fff3d8;
  color: var(--yellow);
}

.statePill.bad {
  background: var(--red-light);
  color: var(--red);
}

/* PATIENT STATUS */

.status {
  text-align: center;
  padding: 28px 20px;
}

.status .sub {
  margin-bottom: 12px;
}

.status h2 {
  font-size: clamp(24px, 3vw, 32px);
  overflow-wrap: anywhere;
}

.normal { color: var(--green); }
.warning { color: var(--yellow); }
.critical { color: var(--red); }

.blink {
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: .45; }
}

/* NAVIGATION AND EMPTY STATES */

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  padding: 11px 17px;
  border: 1px solid #edc7c7;
  border-radius: 10px;
  cursor: pointer;
  background: #fff;
  color: var(--red);
  font-weight: 700;
}

.back-btn:hover {
  background: var(--red-light);
  border-color: #e4a4a4;
}

.emptyState {
  padding: 30px 22px;
  text-align: center;
  color: var(--muted);
  background: #fff;
  border: 1px dashed #e6caca;
  border-radius: 14px;
}

.emptyState h3 {
  color: var(--text);
  margin-bottom: 8px;
}

.emptyIcon {
  font-size: 32px;
  margin-bottom: 10px;
}

/* RESPONSIVE */

@media (max-width: 800px) {
  .wrapper { padding: 16px; }
  .patientGrid { grid-template-columns: 1fr; }
  .title { font-size: 21px; }
  .card { padding: 18px; }
}

@media (max-width: 520px) {
  .wrapper { padding: 12px; }

  .topbar {
    padding: 16px;
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .title { font-size: 20px; }
  .live { font-size: 13px; }
  .loginBox { padding: 30px 22px; }
  .homeGrid { grid-template-columns: 1fr; }
  .metrics { gap: 10px; }
  .metric { padding: 14px; }
  .heartCard { padding: 16px; }
  .patient-name { font-size: 25px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="loginBox">
    <div class="loginIcon" aria-hidden="true">✚</div>
    <h2>ICU Monitor Pro</h2>
    <p class="loginSubtitle">Patient Monitoring Center</p>

    <form id="loginForm">
      <input
        id="user"
        type="text"
        placeholder="Username"
        aria-label="Username"
        autocomplete="username"
        required
      >

      <div class="passwordWrap">
        <input
          id="pass"
          type="password"
          placeholder="Password"
          aria-label="Password"
          autocomplete="current-password"
          required
        >
        <button
          type="button"
          class="passwordToggle"
          id="passwordToggle"
          aria-label="Show password"
        >◉</button>
      </div>

      <button type="submit" class="loginButton">Login</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- MAIN APPLICATION -->
<div class="wrapper" id="app" style="display:none;">

  <div class="topbar">
    <div class="title">Patient Monitoring Center</div>
    <div class="live">
      <span class="dot"></span>
      System Online
    </div>
  </div>

  <div id="homeScreen" class="card"></div>
  <div id="data" style="display:none;"></div>

</div>

<script>
"use strict";

let currentRoom = null;
let refreshTimer = null;
let activeRequest = null;

/* PASSWORD VISIBILITY */
function togglePassword() {
  const pass = document.getElementById("pass");
  const toggle = document.getElementById("passwordToggle");

  pass.type = pass.type === "password" ? "text" : "password";

  toggle.setAttribute(
    "aria-label",
    pass.type === "password" ? "Show password" : "Hide password"
  );
}

document.getElementById("passwordToggle").addEventListener(
  "click",
  togglePassword
);

/* LOGIN */
async function login() {
  const username = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value;
  const error = document.getElementById("error");
  const button = document.querySelector(".loginButton");

  error.textContent = "";

  if (!username || !password) {
    error.textContent = "Enter your username and password.";
    return;
  }

  button.disabled = true;
  button.textContent = "Signing in...";

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const result = await res.json();

    if (!res.ok || !result.success) {
      error.textContent = "Incorrect username or password.";
      return;
    }

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    await renderHome();

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(update, 2000);

  } catch (err) {
    console.error("Login error:", err);
    error.textContent = "Unable to connect to the server.";
  } finally {
    button.disabled = false;
    button.textContent = "Login";
  }
}

document.getElementById("loginForm").addEventListener("submit", event => {
  event.preventDefault();
  login();
});

/* LOAD ROOMS */
async function renderHome() {
  const home = document.getElementById("homeScreen");
  home.innerHTML = '<p class="sub">Loading rooms...</p>';

  try {
    const res = await fetch("/rooms");

    if (!res.ok) {
      throw new Error("Could not load rooms: HTTP " + res.status);
    }

    const rooms = await res.json();

    if (!rooms || typeof rooms !== "object" || Array.isArray(rooms)) {
      throw new Error("Invalid rooms response");
    }

    const ids = Object.keys(rooms);

    if (ids.length === 0) {
      home.innerHTML = `
        <div class="emptyState">
          <h3>No rooms available</h3>
          <p>The server returned no rooms.</p>
        </div>`;
      return;
    }

    const grid = document.createElement("div");
    grid.className = "homeGrid";

    for (const id of ids) {
      const card = document.createElement("div");
      card.className = "homeCard";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");

      const heading = document.createElement("h3");
      heading.textContent = "Room " + id;

      const description = document.createElement("p");
      description.textContent = rooms[id]?.name ?? "Patient room";

      card.append(heading, description);

      card.addEventListener("click", () => openRoom(id));

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openRoom(id);
        }
      });

      grid.appendChild(card);
    }

    home.replaceChildren(grid);

  } catch (err) {
    console.error("Room loading error:", err);

    home.innerHTML = `
      <div class="emptyState">
        <h3>Unable to load rooms</h3>
        <p>Check the server connection and try again.</p>
        <br>
        <button class="back-btn" id="retryRooms">Retry</button>
      </div>`;

    document.getElementById("retryRooms").addEventListener(
      "click", renderHome
    );
  }
}

/* OPEN ROOM */
function openRoom(id) {
  currentRoom = String(id);

  if (activeRequest) {
    activeRequest.abort();
    activeRequest = null;
  }

  document.getElementById("homeScreen").style.display = "none";

  const container = document.getElementById("data");
  container.style.display = "block";
  container.innerHTML = `
    <button class="back-btn" id="backButton">← Back</button>
    <div class="emptyState">
      <h3>Loading patient data...</h3>
    </div>`;

  document.getElementById("backButton").addEventListener("click", goHome);

  update();
}

/* BACK TO HOME */
function goHome() {
  currentRoom = null;

  if (activeRequest) {
    activeRequest.abort();
    activeRequest = null;
  }

  document.getElementById("data").style.display = "none";
  document.getElementById("homeScreen").style.display = "block";
}

/* DISPLAY ECG STATUS */
function getEcgStatus(d) {
  const value = d.ecgStatus ?? d.ecg_status ?? d.rhythm ?? d.ecg;

  if (value === undefined || value === null || value === "") {
    return {
      value: "Awaiting data",
      className: "",
      hint: "ECG classification unavailable"
    };
  }

  const text = String(value);
  const normalized = text.toLowerCase();

  if (
    normalized.includes("critical") ||
    normalized.includes("abnormal") ||
    normalized.includes("arrhythmia")
  ) {
    return {
      value: text,
      className: "bad",
      hint: "Review the ECG analysis"
    };
  }

  if (
    normalized.includes("sinus") ||
    normalized.includes("normal")
  ) {
    return {
      value: text,
      className: "good",
      hint: "Reported rhythm classification"
    };
  }

  return {
    value: text,
    className: "",
    hint: "Reported ECG status"
  };
}

/* DISPLAY MOTION STATUS */
function getMotionStatus(d) {
  const value = d.motion ?? d.motionStatus ?? d.motion_status;

  if (value === undefined || value === null || value === "") {
    return {
      value: "Awaiting data",
      className: "",
      hint: "Motion data unavailable"
    };
  }

  let moving;

  if (typeof value === "boolean") {
    moving = value;
  } else if (typeof value === "number") {
    moving = value !== 0;
  } else {
    const normalized = String(value).trim().toLowerCase();

    if ([
      "yes", "true", "1", "motion", "moving",
      "detected", "motion detected", "active"
    ].includes(normalized)) {
      moving = true;
    } else if ([
      "no", "false", "0", "still", "stationary",
      "not detected", "no motion", "inactive"
    ].includes(normalized)) {
      moving = false;
    } else {
      return {
        value: String(value),
        className: "",
        hint: "Reported motion status"
      };
    }
  }

  return moving
    ? {
        value: "Motion Detected",
        className: "warn",
        hint: "Movement reported by sensor"
      }
    : {
        value: "No Motion",
        className: "good",
        hint: "No movement reported"
      };
}

/* BUILD A VITAL CARD */
function createMetric({
  icon,
  label,
  value,
  unit = "",
  hint = "",
  stateClass = "",
  state = false
}) {
  const card = document.createElement("div");
  card.className = "metric";

  const top = document.createElement("div");
  top.className = "metricTop";

  const iconBox = document.createElement("div");
  iconBox.className = "metricIcon";
  iconBox.textContent = icon;

  const labelBox = document.createElement("div");
  labelBox.className = "label";
  labelBox.textContent = label;

  top.append(iconBox, labelBox);

  const valueBox = document.createElement("div");
  valueBox.className = "val" + (state ? " stateValue" : "");
  valueBox.textContent = value;

  if (unit) {
    const unitBox = document.createElement("span");
    unitBox.className = "unit";
    unitBox.textContent = " " + unit;
    valueBox.appendChild(unitBox);
  }

  card.append(top, valueBox);

  if (state) {
    const pill = document.createElement("div");
    pill.className = "statePill " + stateClass;
    pill.textContent = stateClass === "good"
      ? "Status reported"
      : stateClass === "warn"
        ? "Movement reported"
        : stateClass === "bad"
          ? "Review status"
          : "Status unavailable";

    card.appendChild(pill);
  }

  if (hint) {
    const hintBox = document.createElement("div");
    hintBox.className = "hint";
    hintBox.textContent = hint;
    card.appendChild(hintBox);
  }

  return card;
}

/* UPDATE PATIENT DATA */
async function update() {
  if (currentRoom === null || activeRequest) return;

  const requestedRoom = currentRoom;
  const controller = new AbortController();
  activeRequest = controller;

  try {
    const res = await fetch(
      "/room/" + encodeURIComponent(requestedRoom),
      { signal: controller.signal }
    );

    if (!res.ok) {
      throw new Error("Patient request failed: HTTP " + res.status);
    }

    const d = await res.json();

    if (currentRoom !== requestedRoom) return;

    const container = document.getElementById("data");

    if (d.message) {
      container.innerHTML = `
        <button class="back-btn" id="backButton">← Back</button>
        <div class="emptyState">
          <div class="emptyIcon">♡</div>
          <h3>No patient data yet</h3>
          <p>Waiting for monitoring data from this room.</p>
        </div>`;

      document.getElementById("backButton").addEventListener("click", goHome);
      return;
    }

    const status = String(d.status ?? "No Data");
    const normalizedStatus = status.toLowerCase();

    const statusClass = ["normal", "warning", "critical"].includes(normalizedStatus)
      ? normalizedStatus
      : "";

    const blink = normalizedStatus === "critical" ? "blink" : "";

    container.replaceChildren();

    const backButton = document.createElement("button");
    backButton.className = "back-btn";
    backButton.textContent = "← Back";
    backButton.addEventListener("click", goHome);
    container.appendChild(backButton);

    const layout = document.createElement("div");
    layout.className = "patientGrid";

    const main = document.createElement("div");
    main.className = "card";

    const patientName = document.createElement("div");
    patientName.className = "patient-name";
    patientName.textContent = d.name ?? "Patient";

    const roomLabel = document.createElement("div");
    roomLabel.className = "sub";
    roomLabel.textContent = "Room " + requestedRoom;

    main.append(patientName, roomLabel);

    const heart = document.createElement("div");
    heart.className = "heartCard";

    const heartHeader = document.createElement("div");
    heartHeader.className = "heartHeader";

    const heartLabel = document.createElement("div");
    heartLabel.className = "heartLabel";
    heartLabel.textContent = "HEART RATE";

    const liveTag = document.createElement("div");
    liveTag.className = "liveTag";
    liveTag.textContent = "● Live readings";

    heartHeader.append(heartLabel, liveTag);

    const bigHr = document.createElement("div");
    bigHr.className = "bigHr";
    bigHr.appendChild(
      document.createTextNode(String(d.hr ?? "--") + " ")
    );

    const bpm = document.createElement("span");
    bpm.textContent = "BPM";
    bigHr.appendChild(bpm);

    heart.append(heartHeader, bigHr);
    main.appendChild(heart);

    const sectionTitle = document.createElement("h3");
    sectionTitle.className = "sectionTitle";
    sectionTitle.textContent = "Vital Signs";
    main.appendChild(sectionTitle);

    const metrics = document.createElement("div");
    metrics.className = "metrics";

    const ecg = getEcgStatus(d);
    const motion = getMotionStatus(d);

    metrics.append(
      createMetric({
        icon: "O₂",
        label: "SpO₂",
        value: d.spo2 ?? "--",
        unit: d.spo2 == null ? "" : "%"
      }),

      createMetric({
        icon: "°",
        label: "Body Temperature",
        value: d.bodyTemp ?? "--",
        unit: d.bodyTemp == null ? "" : "°C"
      }),

      createMetric({
        icon: "♥",
        label: "ECG Status",
        value: ecg.value,
        hint: ecg.hint,
        stateClass: ecg.className,
        state: true
      }),

      createMetric({
        icon: "↔",
        label: "Motion",
        value: motion.value,
        hint: motion.hint,
        stateClass: motion.className,
        state: true
      }),

      createMetric({
        icon: "◉",
        label: "Water Level",
        value: d.water ?? "--",
        unit: d.water == null ? "" : "%"
      })
    );

    main.appendChild(metrics);

    const side = document.createElement("div");
    side.className = "card status";

    const statusLabel = document.createElement("div");
    statusLabel.className = "sub";
    statusLabel.textContent = "Patient Status";

    const statusHeading = document.createElement("h2");
    statusHeading.className = statusClass + " " + blink;
    statusHeading.textContent = status;

    side.append(statusLabel, statusHeading);

    layout.append(main, side);
    container.appendChild(layout);

  } catch (err) {
    if (err.name === "AbortError") return;
    if (currentRoom !== requestedRoom) return;

    console.error("Patient data error:", err);

    const container = document.getElementById("data");
    container.innerHTML = `
      <button class="back-btn" id="backButton">← Back</button>
      <div class="emptyState">
        <h3>Unable to load patient data</h3>
        <p>Checking the connection again shortly...</p>
      </div>`;

    document.getElementById("backButton").addEventListener("click", goHome);

  } finally {
    if (activeRequest === controller) {
      activeRequest = null;
    }
  }
}

/* REFRESH EVERY TWO SECONDS */
refreshTimer = setInterval(update, 2000);
</script>

</body>
</html>
