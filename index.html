
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fc">
<title>ICU Monitor Pro</title>

<style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --panel2: #fff5f5;
  --line: #eadfe1;
  --red: #c62828;
  --red-dark: #a51f27;
  --red-light: #fee8e8;
  --green: #16834a;
  --yellow: #a66b00;
  --text: #242833;
  --muted: #727987;
  --shadow: 0 5px 22px rgba(60, 30, 35, 0.06);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button, input {
  font: inherit;
}

button {
  transition: background .2s, transform .2s, box-shadow .2s;
}

/* LOGIN */

#loginScreen {
  display: flex;
  min-height: 100vh;
  justify-content: center;
  align-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at top right, #ffe8e8 0, transparent 35%),
    linear-gradient(145deg, #fffafa, #f5f6fa);
}

.loginBox {
  width: 100%;
  max-width: 390px;
  padding: 38px 32px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--panel);
  box-shadow: 0 18px 55px rgba(100, 30, 40, .10);
  text-align: center;
}

.loginIcon {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  border-radius: 20px;
  background: var(--red-light);
  color: var(--red);
  font-size: 32px;
}

.loginBox h2 {
  color: var(--red);
  font-size: 27px;
  margin-bottom: 8px;
}

.loginSubtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 26px;
}

.loginBox input {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  margin: 0 0 14px;
  border: 1px solid #dfe2e8;
  border-radius: 10px;
  outline: none;
  background: #fff;
  color: var(--text);
  transition: border-color .2s, box-shadow .2s;
}

.loginBox input:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(198, 40, 40, .09);
}

.passwordWrap {
  position: relative;
}

.passwordWrap input {
  padding-right: 45px;
}

.passwordToggle {
  position: absolute;
  right: 12px;
  top: 15px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 17px;
}

.loginBox .loginButton {
  width: 100%;
  min-height: 48px;
  margin-top: 4px;
  border: none;
  border-radius: 10px;
  background: var(--red);
  color: #fff;
  cursor: pointer;
  font-weight: 700;
}

.loginBox .loginButton:hover {
  background: var(--red-dark);
  box-shadow: 0 5px 15px rgba(198, 40, 40, .18);
}

#error {
  margin-top: 14px;
  font-size: 13px;
}

/* APPLICATION */

.wrapper {
  min-height: 100vh;
  padding: 24px;
  max-width: 1800px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  padding: 20px 24px;
  border-radius: 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}

.title {
  font-size: 25px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.live {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--green);
  font-size: 14px;
  font-weight: 600;
}

.dot {
  width: 9px;
  height: 9px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #20a464;
  box-shadow: 0 0 0 4px #e6f7ed;
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 0 7px rgba(32, 164, 100, .08);
  }
}

/* ROOM SELECTION */

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.homeGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.homeCard {
  position: relative;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 22px;
  cursor: pointer;
  transition: .22s ease;
  outline: none;
}

.homeCard::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--red);
  opacity: .65;
}

.homeCard:hover,
.homeCard:focus-visible {
  transform: translateY(-3px);
  border-color: #e7aaaa;
  background: #fff8f8;
  box-shadow: 0 9px 25px rgba(130, 30, 40, .09);
}

.homeCard h3 {
  font-size: 19px;
  color: var(--text);
  margin-bottom: 9px;
}

.homeCard p {
  color: var(--muted);
  font-size: 14px;
}

/* PATIENT DASHBOARD */

.grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
  gap: 20px;
  align-items: start;
}

.patient-name {
  font-size: 29px;
  font-weight: 750;
  letter-spacing: -.5px;
  margin-bottom: 6px;
  overflow-wrap: anywhere;
}

.sub {
  color: var(--muted);
  font-size: 15px;
}

.monitor {
  margin-top: 22px;
  padding: 24px;
  border-radius: 16px;
  background: #fffafa;
  border: 1px solid #f0dada;
  overflow: hidden;
}

.monitorHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.monitorLabel {
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}

.liveTag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--red);
  font-size: 12px;
  font-weight: 700;
  background: var(--red-light);
  padding: 6px 10px;
  border-radius: 20px;
}

.bigHr {
  font-size: clamp(42px, 5vw, 68px);
  line-height: 1.2;
  color: var(--red);
  font-weight: 800;
  letter-spacing: -2px;
  overflow-wrap: anywhere;
}

.bigHr span {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--muted);
}

svg {
  display: block;
  width: 100%;
  height: 125px;
  margin-top: 14px;
}

path {
  stroke: var(--red);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 600;
  animation: ecg 2.2s linear infinite;
}

@keyframes ecg {
  0% { stroke-dashoffset: 600; }
  100% { stroke-dashoffset: 0; }
}

/* VITAL SIGN CARDS */

.metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
  margin-top: 18px;
}

.metric {
  background: #fff;
  border: 1px solid var(--line);
  padding: 19px;
  border-radius: 14px;
  transition: border-color .2s, box-shadow .2s;
}

.metric:hover {
  border-color: #e7b6b6;
  box-shadow: 0 4px 15px rgba(130, 30, 40, .05);
}

.metric .label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.metric .val {
  font-size: clamp(23px, 3vw, 29px);
  font-weight: 750;
  margin-top: 9px;
  color: var(--text);
  overflow-wrap: anywhere;
}

/* STATUS */

.status {
  text-align: center;
  padding: 28px 20px;
}

.status .sub {
  margin-bottom: 12px;
}

.status h2 {
  font-size: clamp(24px, 3vw, 32px);
  overflow-wrap: anywhere;
}

.normal { color: var(--green); }
.warning { color: var(--yellow); }
.critical { color: var(--red); }

.blink {
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: .45; }
}

/* BACK BUTTON */

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  padding: 11px 17px;
  border: 1px solid #edc7c7;
  border-radius: 10px;
  cursor: pointer;
  background: #fff;
  color: var(--red);
  font-weight: 700;
}

.back-btn:hover {
  background: var(--red-light);
  border-color: #e4a4a4;
}

/* EMPTY STATES */

.emptyState {
  padding: 30px 22px;
  text-align: center;
  color: var(--muted);
  background: #fff;
  border: 1px dashed #e6caca;
  border-radius: 14px;
}

.emptyState h3 {
  color: var(--text);
  margin-bottom: 8px;
}

.emptyIcon {
  font-size: 32px;
  margin-bottom: 10px;
}

/* RESPONSIVE */

@media (max-width: 800px) {
  .wrapper { padding: 16px; }

  .grid {
    grid-template-columns: 1fr;
  }

  .title { font-size: 21px; }

  .card { padding: 18px; }
}

@media (max-width: 520px) {
  .wrapper { padding: 12px; }

  .topbar {
    padding: 16px;
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .title { font-size: 20px; }
  .live { font-size: 13px; }

  .loginBox { padding: 30px 22px; }

  .homeGrid { grid-template-columns: 1fr; }
  .metrics { gap: 10px; }
  .metric { padding: 14px; }
  .monitor { padding: 16px; }
  .patient-name { font-size: 25px; }
  svg { height: 100px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <div class="loginIcon" aria-hidden="true">✚</div>
    <h2>ICU Monitor Pro</h2>
    <p class="loginSubtitle">Patient Monitoring Center</p>

    <form id="loginForm">
      <input
        id="user"
        type="text"
        placeholder="Username"
        aria-label="Username"
        autocomplete="username"
        required
      >

      <div class="passwordWrap">
        <input
          id="pass"
          type="password"
          placeholder="Password"
          aria-label="Password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="passwordToggle"
          id="passwordToggle"
          aria-label="Show password"
          title="Show or hide password"
        >◉</button>
      </div>

      <button type="submit" class="loginButton">Login</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- APPLICATION -->
<div class="wrapper" id="app" style="display:none;">

  <div class="topbar">
    <div class="title">Patient Monitoring Center</div>

    <div class="live">
      <span class="dot"></span>
      System Online
    </div>
  </div>

  <div id="homeScreen" class="card"></div>
  <div id="data" style="display:none;"></div>

</div>

<script>
"use strict";

let currentRoom = null;
let refreshTimer = null;

/* SHOW / HIDE PASSWORD */
function togglePassword() {
  const pass = document.getElementById("pass");
  const toggle = document.getElementById("passwordToggle");

  pass.type = pass.type === "password" ? "text" : "password";

  toggle.setAttribute(
    "aria-label",
    pass.type === "password" ? "Show password" : "Hide password"
  );
}

document.getElementById("passwordToggle").addEventListener(
  "click",
  togglePassword
);

/* LOGIN */
async function login() {
  const username = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value;
  const error = document.getElementById("error");
  const button = document.querySelector(".loginButton");

  error.textContent = "";

  if (!username || !password) {
    error.textContent = "Enter your username and password.";
    return;
  }

  button.disabled = true;
  button.textContent = "Signing in...";

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const result = await res.json();

    if (!res.ok || !result.success) {
      error.textContent = "Incorrect username or password.";
      return;
    }

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    await renderHome();

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(update, 2000);

  } catch (err) {
    console.error("Login error:", err);
    error.textContent = "Unable to connect to the server.";
  } finally {
    button.disabled = false;
    button.textContent = "Login";
  }
}

document.getElementById("loginForm").addEventListener("submit", (event) => {
  event.preventDefault();
  login();
});

/* ESCAPE SERVER VALUES BEFORE DISPLAYING THEM AS HTML */
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

/* LOAD ROOMS */
async function renderHome() {
  const home = document.getElementById("homeScreen");
  home.innerHTML = '<p class="sub">Loading rooms...</p>';

  try {
    const res = await fetch("/rooms");

    if (!res.ok) {
      throw new Error("Could not load rooms: HTTP " + res.status);
    }

    const rooms = await res.json();

    if (!rooms || typeof rooms !== "object" || Array.isArray(rooms)) {
      throw new Error("Invalid rooms response");
    }

    const roomIds = Object.keys(rooms);

    if (roomIds.length === 0) {
      home.innerHTML = `
        <div class="emptyState">
          <div class="emptyIcon">✚</div>
          <h3>No rooms available</h3>
          <p>The server returned no rooms.</p>
        </div>`;
      return;
    }

    const grid = document.createElement("div");
    grid.className = "homeGrid";

    for (const roomId of roomIds) {
      const room = rooms[roomId];
      const card = document.createElement("div");

      card.className = "homeCard";
      card.dataset.room = roomId;
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");

      const heading = document.createElement("h3");
      heading.textContent = "Room " + roomId;

      const description = document.createElement("p");
      description.textContent = room?.name ?? "Patient room";

      card.append(heading, description);

      // Attach the room ID directly instead of generating inline JavaScript.
      card.addEventListener("click", () => openRoom(roomId));

      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openRoom(roomId);
        }
      });

      grid.appendChild(card);
    }

    home.replaceChildren(grid);

  } catch (err) {
    console.error("Room loading error:", err);

    home.innerHTML = `
      <div class="emptyState">
        <h3>Unable to load rooms</h3>
        <p>Check the server connection and try again.</p>
        <br>
        <button class="back-btn" id="retryRooms">Retry</button>
      </div>`;

    document.getElementById("retryRooms").addEventListener("click", renderHome);
  }
}

/* OPEN ROOM */
function openRoom(id) {
  currentRoom = String(id);

  document.getElementById("homeScreen").style.display = "none";

  const container = document.getElementById("data");
  container.style.display = "block";
  container.innerHTML = `
    <button class="back-btn" id="backButton">← Back</button>
    <div class="emptyState">
      <h3>Loading patient data...</h3>
    </div>`;

  document.getElementById("backButton").addEventListener("click", goHome);

  update();
}

/* BACK TO HOME */
function goHome() {
  currentRoom = null;

  document.getElementById("data").style.display = "none";
  document.getElementById("homeScreen").style.display = "block";
}

/* UPDATE PATIENT DATA */
async function update() {
  if (currentRoom === null) return;

  const requestedRoom = currentRoom;

  try {
    const res = await fetch(
      "/room/" + encodeURIComponent(requestedRoom)
    );

    if (!res.ok) {
      throw new Error("Patient request failed: HTTP " + res.status);
    }

    const d = await res.json();

    // Ignore responses belonging to a room that is no longer selected.
    if (currentRoom !== requestedRoom) return;

    const container = document.getElementById("data");

    if (d.message) {
      container.innerHTML = `
        <button class="back-btn" id="backButton">← Back</button>
        <div class="emptyState">
          <div class="emptyIcon">♡</div>
          <h3>No patient data yet</h3>
          <p>Waiting for monitoring data from this room.</p>
        </div>`;

      document.getElementById("backButton").addEventListener("click", goHome);
      return;
    }

    const status = String(d.status ?? "No Data");
    const statusClass = status.toLowerCase();
    const validStatusClass = ["normal", "warning", "critical"].includes(statusClass)
      ? statusClass
      : "";

    const blink = statusClass === "critical" ? "blink" : "";

    container.innerHTML = `
      <button class="back-btn" id="backButton">← Back</button>

      <div class="grid">
        <div class="card">
          <div class="patient-name">${escapeHTML(d.name ?? "Patient")}</div>
          <div class="sub">Room ${escapeHTML(requestedRoom)}</div>

          <div class="monitor">
            <div class="monitorHeader">
              <div class="monitorLabel">HEART RATE</div>
              <div class="liveTag"><span>●</span> Patient vitals</div>
            </div>

            <div class="bigHr">
              ${escapeHTML(d.hr ?? "--")} <span>BPM</span>
            </div>

            <svg viewBox="0 0 500 120" role="img"
                 aria-label="Decorative ECG waveform">
              <path d="M0 70 L50 70 L80 35 L100 95 L130 20 L160 70 L220 70 L250 55 L280 70 L500 70"/>
            </svg>
          </div>

          <div class="metrics">
            <div class="metric">
              <div class="label">SpO₂</div>
              <div class="val">${escapeHTML(d.spo2 ?? "--")}${d.spo2 == null ? "" : "%"}</div>
            </div>

            <div class="metric">
              <div class="label">Body Temperature</div>
              <div class="val">${escapeHTML(d.bodyTemp ?? "--")}${d.bodyTemp == null ? "" : "°C"}</div>
            </div>

            <div class="metric">
              <div class="label">Humidity</div>
              <div class="val">${escapeHTML(d.humidity ?? "--")}${d.humidity == null ? "" : "%"}</div>
            </div>

            <div class="metric">
              <div class="label">Water Level</div>
              <div class="val">${escapeHTML(d.water ?? "--")}${d.water == null ? "" : "%"}</div>
            </div>
          </div>
        </div>

        <div class="card status">
          <div class="sub">Patient Status</div>
          <h2 class="${validStatusClass} ${blink}">
            ${escapeHTML(status)}
          </h2>
        </div>
      </div>`;

    document.getElementById("backButton").addEventListener("click", goHome);

  } catch (err) {
    if (currentRoom !== requestedRoom) return;

    console.error("Patient data error:", err);

    const container = document.getElementById("data");

    container.innerHTML = `
      <button class="back-btn" id="backButton">← Back</button>
      <div class="emptyState">
        <h3>Unable to load patient data</h3>
        <p>Checking the connection again shortly...</p>
      </div>`;

    document.getElementById("backButton").addEventListener("click", goHome);
  }
}
</script>

</body>
</html>
